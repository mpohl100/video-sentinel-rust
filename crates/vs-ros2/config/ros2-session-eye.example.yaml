# Example eye-session ROS 2 node configuration.
node:
  name: video_sentinel_ros2_eye
  namespace: /
  max_message_age_ms: 250
topics:
  image: /camera/image/compressed
session:
  type: eye
  id: billard-eye-session
  basic_params:
    do_grayscale: true
    gradient_threshold: 15
  results: absolute
  eye_params:
    tile_params:
      tile_x: 0.1
      tile_y: 0.1
    bucket_delta: 0.1
    trace_params:
      num_skeleton: 18
    target_similarity: 0.7
