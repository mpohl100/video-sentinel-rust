# Example ordinary-session ROS 2 node configuration.
node:
  name: video_sentinel_ros2
  namespace: /
  max_message_age_ms: 250
topics:
  image: /camera/image/compressed
session:
  type: ordinary
  id: billard-session
  basic_params:
    do_grayscale: true
    gradient_threshold: 15
  # Optional: retain mosaics matching at least one filter (per-channel tolerance).
  # color_filters:
  #   - color: { red: 255, green: 0, blue: 0 }
  #     threshold_for_color: { red: 20, green: 10, blue: 10 }
