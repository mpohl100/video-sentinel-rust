[package]
name = "video-sentinel"
version = "0.1.0"
edition = "2024"

[dependencies]
rs-math3d = "0.9.24"
opencv = { version = "0.101.0", default-features = false, features = ["clang-runtime", "imgcodecs", "imgproc"] }
video-rs = { version = "0.11", features = ["ndarray"] }
clap = { version = "4.5", features = ["derive"] }
async-graphql = "7"
async-graphql-axum = "7"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rcgen = "0.14"
smallvec = "1.13"
num-traits = "0.2"

[dev-dependencies]
graphql_client = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde_json = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }


[[bin]]
name = "video-sentinel-exe"
path = "src/main.rs"

[[bin]]
name = "video-sentinel-service"
path = "src/service_main.rs"

[[bench]]
name = "get_rectangles"
harness = false

[[bench]]
name = "pipeline"
harness = false

[profile.release]
debug = 2